services:
  db:
    image: mysql:8.0
    container_name: game-mysql
    restart: always
    environment:
      MYSQL_DATABASE: shooting_game_db
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: shooting_game
      MYSQL_PASSWORD: apple
    ports:
      - "3307:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
