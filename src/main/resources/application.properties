spring.application.name=shooting-game

# MySQL への接続情報
spring.datasource.url=jdbc:mysql://localhost:3307/shooting_game_db?createDatabaseIfNotExist=true
spring.datasource.username=shooting_game
spring.datasource.password=apple
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# テーブルを自動作成する設定
spring.jpa.hibernate.ddl-auto=update
# 実行されるSQLを表示する（デバッグ用）
spring.jpa.show-sql=true
# Webサーバー機能をオフにする
spring.main.web-application-type=none