spring.application.name=shooting-game

# MySQL への接続情報
# AWS RDS のエンドポイント
spring.datasource.url=jdbc:mysql://database-1.cb24i0eg0ni7.ap-northeast-1.rds.amazonaws.com:3306/shooting_game_db?createDatabaseIfNotExist=true&useSSL=true&trustCertificateKeyStoreUrl=file:./global-bundle.pem&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=ShootingGameDB
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# テーブルを自動作成する設定
spring.jpa.hibernate.ddl-auto=update
# 実行されるSQLを表示する（デバッグ用）
spring.jpa.show-sql=true
# Webサーバー機能をオフにする
spring.main.web-application-type=none